# X11 + xclip 用クリップボード
setw -g mode-keys vi
set -g copy-command "xclip -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -n MouseDown3Pane run-shell -t = "xclip -o -selection clipboard | tr -d '\\r' | tmux load-buffer - && tmux paste-buffer -p -r -t '#{pane_id}'"
bind-key -n M-MouseDown3Pane display-menu -T "#[align=centre]#{pane_index}" -t = -x M -y M "Split H" h { split-window -h } "Split V" v { split-window -v } "Kill" X { kill-pane } "Zoom" z { resize-pane -Z }
