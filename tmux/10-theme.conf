set -g status-position top
set -g status-style bg=default,fg="#c0caf5"

set -g status-left-length 30
set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=default]"

setw -g window-status-format "#[fg=#565f89,bg=default]  #I:#W#F  "
setw -g window-status-current-format "#[fg=#7aa2f7,bg=#3b4261,bold] #[fg=#7aa2f7]#I:#W#F #[fg=#3b4261,bg=default]"
setw -g window-status-separator ""

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status-right-length 100
set -g status-right "#[fg=#414868]#[fg=#7aa2f7,bg=#414868]  #{cpu_percentage} #[fg=#9ece6a]  #{ram_percentage} #[fg=#7aa2f7,bg=#414868]#[fg=#15161e,bg=#7aa2f7,bold] %H:%M "
