source-file ~/.tmux/00-base.conf
source-file ~/.tmux/10-theme.conf
source-file ~/.tmux/20-keybinds.conf
source-file ~/.tmux/30-plugins.conf

# Clipboard actions are configured in the platform-specific tmux module.
unbind-key -T root MouseDown2Pane
unbind-key -T root MouseDown3Pane
unbind-key -T root S-MouseDown3Pane
# Always copy a mouse drag, including inside programs that enable mouse input.
bind-key -T root MouseDrag1Pane copy-mode -M

# --- クリップボード（macOS / WSL / Wayland / X11 を自動判定）---
if-shell 'test "$(uname -s)" = Darwin' \
  'source-file ~/.tmux/42-copy-paste-macos.conf' \
  'if-shell "[ -n \"$WSL_DISTRO_NAME\" ] && command -v win32yank.exe >/dev/null 2>&1" "source-file ~/.tmux/43-copy-paste-wsl.conf" "if-shell \"[ -n \\\"$WAYLAND_DISPLAY\\\" ]\" \"source-file ~/.tmux/40-copy-paste-wayland.conf\" \"source-file ~/.tmux/41-copy-paste-x11.conf\""'
